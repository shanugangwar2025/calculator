<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
    <div class="cals-text"> <p id="user-input">0</p></div>
    <div class="cals-keys"> 
        <button class="key-other"> AC</button>
        <button class="key-other"> DEL</button>
        <button class="key-other"> %</button>
        <button class="key-other-operations"> <pre>/ </pre></button>
        <button class="number">7</button>
        <button class="number">8</button>
         <button class="number">9</button>
        <button class="key-other-operations">  *</button>
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="key-other-operations"> - </button>
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="key-other-operations"> + </button>
        <button class="key-zero number">0</button>
        <button class="number"> . </button>
        <button class="key-other-operations" id="equal"> = </button>
</div>
<script src="script.js"></script>
</body>
</html>
